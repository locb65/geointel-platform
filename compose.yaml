services:
  db:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_USER: geointel
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: geointel
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U geointel -d geointel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: